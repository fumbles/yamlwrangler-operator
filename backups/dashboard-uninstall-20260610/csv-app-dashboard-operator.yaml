  customresourcedefinitions:
    owned:
    - description: Installs and manages the OpenShift console dashboard plugin.
      displayName: App Dashboard
      kind: AppDashboard
      name: appdashboards.dashboard.yamlwrangler.com
      version: v1alpha1
    - description: Selects and groups deployments for dashboard display.
      displayName: Dashboard App Group
      kind: DashboardAppGroup
      name: dashboardappgroups.dashboard.yamlwrangler.com
      version: v1alpha1
  description: Installs and manages the Yamlwrangler App Dashboard console plugin
    for OpenShift.
  displayName: Yamlwrangler App Dashboard Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - dashboard.yamlwrangler.com
          resources:
          - dashboardappgroups
          - appdashboards
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - dashboard.yamlwrangler.com
          resources:
          - dashboardappgroups/status
          - appdashboards/status
          verbs:
          - get
          - update
          - patch
        - apiGroups:
          - dashboard.yamlwrangler.com
          resources:
          - dashboardappgroups/finalizers
          - appdashboards/finalizers
          verbs:
          - update
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
        - apiGroups:
          - ""
          resources:
          - namespaces
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
        - apiGroups:
          - ""
          resources:
          - serviceaccounts
          - services
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - console.openshift.io
          resources:
          - consoleplugins
          - consolelinks
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - operator.openshift.io
          resources:
          - consoles
          verbs:
          - get
          - list
          - watch
          - update
          - patch
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        serviceAccountName: app-dashboard-operator
      deployments:
      - name: app-dashboard-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: app-dashboard-operator
          template:
            metadata:
              labels:
                app: app-dashboard-operator
            spec:
              containers:
              - args:
                - --leader-elect
                command:
                - /manager
                image: image-registry.openshift-image-registry.svc:5000/app-dashboard-operator/app-dashboard-operator:v0.1.0
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: health
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
                - containerPort: 8081
                  name: health
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: health
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
              securityContext:
                runAsNonRoot: true
              serviceAccountName: app-dashboard-operator
