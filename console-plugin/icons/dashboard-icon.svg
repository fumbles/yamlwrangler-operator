<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CCFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33AAFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="8" fill="#f0f0f0"/>
  <!-- Dashboard tiles with gradients -->
  <rect x="6" y="6" width="16" height="16" rx="3" fill="url(#grad1)"/>
  <rect x="26" y="6" width="16" height="16" rx="3" fill="url(#grad2)"/>
  <rect x="6" y="26" width="16" height="16" rx="3" fill="url(#grad3)"/>
  <rect x="26" y="26" width="16" height="16" rx="3" fill="url(#grad4)"/>
</svg>

