apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboardappgroups.dashboard.yamlwrangler.com
spec:
  group: dashboard.yamlwrangler.com
  scope: Namespaced
  names:
    plural: dashboardappgroups
    singular: dashboardappgroup
    kind: DashboardAppGroup
    shortNames:
      - dag
      - dags
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: DashboardAppGroup labels matching deployments for display in the dashboard.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - displayName
                - category
                - selector
              properties:
                displayName:
                  type: string
                category:
                  type: string
                description:
                  type: string
                primaryRoute:
                  type: string
                autoLabel:
                  type: boolean
                  default: true
                selector:
                  type: object
                  properties:
                    matchPattern:
                      type: string
                    matchNames:
                      type: array
                      items:
                        type: string
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                customLinks:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                      icon:
                        type: string
            status:
              type: object
              properties:
                matchedDeployments:
                  type: array
                  items:
                    type: string
                lastUpdated:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
