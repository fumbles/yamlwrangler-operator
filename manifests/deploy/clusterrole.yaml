apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-dashboard-operator
rules:
  # DashboardAppGroup resources
  - apiGroups:
      - dashboard.yamlwrangler.com
    resources:
      - dashboardappgroups
      - appdashboards
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - dashboard.yamlwrangler.com
    resources:
      - dashboardappgroups/status
      - appdashboards/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - dashboard.yamlwrangler.com
    resources:
      - dashboardappgroups/finalizers
      - appdashboards/finalizers
    verbs:
      - update
  # Deployments - need to read/update app annotations and manage the console plugin workload
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Namespaces - need to watch labeled namespaces and create the console plugin namespace
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Core resources - need to manage the console plugin workload and dashboard configs
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # OpenShift console plugin resources
  - apiGroups:
      - console.openshift.io
    resources:
      - consoleplugins
      - consolelinks
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # OpenShift console operator - optionally enable the plugin in spec.plugins
  - apiGroups:
      - operator.openshift.io
    resources:
      - consoles
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Routes - need to read routes for auto-discovery
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
  # Events for logging
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

