apiVersion: v1
kind: Namespace
metadata:
  name: app-dashboard-operator
  labels:
    app: app-dashboard-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: app-dashboard-operator
  namespace: app-dashboard-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: yamlwrangler-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: docker.io/fumbles/yamlwrangler-operator-catalog:v1.0.6
  displayName: Yamlwrangler Operators
  publisher: Yamlwrangler
  updateStrategy:
    registryPoll:
      interval: 10m
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: app-dashboard-operator
  namespace: app-dashboard-operator
spec:
  channel: alpha
  installPlanApproval: Automatic
  name: app-dashboard-operator
  source: yamlwrangler-catalog
  sourceNamespace: openshift-marketplace
